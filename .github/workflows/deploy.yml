# Construit le site et le publie sur GitHub Pages à chaque envoi sur la branche main.
name: Déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# Une publication à la fois, sans interrompre celle en cours : interrompre une publication
# GitHub Pages peut la laisser bloquée « en cours » et faire échouer les suivantes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifications (types, mise en forme, lint)
        run: |
          npm run check
          npm run lint
      - name: Tests unitaires (moteur de quêtes)
        run: npm test
      - run: npm run build
      - name: Budget de poids (sobriété)
        run: npm run budget
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (parcours, accessibilité, hors-ligne)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si une publication précédente est restée bloquée « en cours » chez GitHub Pages,
      # on l'annule avant de publier (sinon GitHub refuse la nouvelle publication).
      - name: Débloquer une publication précédente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            status=$(gh api "repos/${{ github.repository }}/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            case "$status" in
              deployment_queued|deployment_in_progress|syncing_files|updating_pages|deployment_cancelled_pending)
                echo "Annulation de la publication bloquée $sha ($status)"
                gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true ;;
            esac
          done
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages est parfois lent : 20 minutes au lieu de 10.
          timeout: 1200000
